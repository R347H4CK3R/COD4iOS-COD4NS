name: IW5 metadata validation

on:
  push:
    branches: [feature/iw5-mw3-foundation]
    paths:
      - 'tools/iw5/**'
      - 'tests/iw5/**'
      - '.github/workflows/iw5-validation.yml'
  pull_request:
    paths:
      - 'tools/iw5/**'
      - 'tests/iw5/**'
      - '.github/workflows/iw5-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-format-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile IW5 Python modules
        run: python -m compileall -q tools/iw5 tests/iw5
      - name: Run synthetic fastfile tests
        run: python -m unittest discover -s tests/iw5 -p 'test_*.py' -v
