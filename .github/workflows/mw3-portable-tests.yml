name: MW3 portable gameplay tests
on:
  push:
    paths:
      - 'ports/ios/core/mw3_*'
      - 'ports/ios/tests/mw3_*'
      - '.github/workflows/mw3-portable-tests.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run native registry/effect/bridge tests
        shell: bash
        run: |
          set -euo pipefail
          SRC="ports/ios/core"
          TEST="ports/ios/tests"
          COMMON=("$SRC/mw3_gameplay_registry.cpp" "$SRC/mw3_gameplay_bridge.cpp" "$SRC/mw3_gameplay_effects.cpp" "$SRC/mw3_combat_adapter.cpp" "$SRC/mw3_definition_loader.cpp" "$SRC/mw3_equipment_adapter.cpp" "$SRC/mw3_survival_waves.cpp")
          for test in mw3_registry_tests mw3_bridge_tests mw3_effect_tests mw3_combat_adapter_tests mw3_loader_tests mw3_equipment_tests mw3_survival_tests; do
            g++ -std=c++17 -O0 -g -Wall -Wextra -Werror -pthread "${COMMON[@]}" "$TEST/$test.cpp" -o "/tmp/$test"
            "/tmp/$test"
          done
      - name: Run configuration tests
        run: python3 -m unittest discover -s tests -p test_mw3_gameplay_config.py -v
