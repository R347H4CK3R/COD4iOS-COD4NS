name: Survival logic smoke test
on:
  push:
    branches: [feature/specops-survival]
  pull_request:
  workflow_dispatch:
jobs:
  survival-logic:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Compile with C++17
        run: c++ -std=c++17 -Wall -Wextra -Werror -pedantic -I. ports/ios/survival/tests/session_smoke.cpp -o /tmp/survival_smoke
      - name: Run smoke test
        run: /tmp/survival_smoke
      - name: Runtime and bridge regressions
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic ports/ios/survival/tests/runtime_tests.cpp -o /tmp/runtime_tests
          /tmp/runtime_tests
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic ports/ios/survival/tests/bridge_tests.cpp ports/ios/survival/SurvivalBridge.cpp -pthread -o /tmp/bridge_tests
          /tmp/bridge_tests
      - name: Host build and tests
        run: |
          cmake -S . -B build/host -DKISAK_BUILD_PORT_TESTS=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/host --parallel 2
          ctest --test-dir build/host --output-on-failure
          python3 ports/ios/survival/tests/map_target_tests.py
          python3 ports/ios/survival/tests/native_actions_tests.py
          python3 ports/ios/survival/tests/reload_timing_tests.py
          python3 ports/ios/survival/tests/imported_weapon_tests.py
          python3 tools/mw3_maps/test_export_oat_world.py
          python3 tools/mw3_maps/test_export_oat_collision.py
          python3 tools/mw3_maps/test_export_oat_navigation.py
          python3 tools/mw3_maps/test_export_oat_brushes.py
          python3 tools/mw3_maps/test_translate_entities.py
          python3 tools/mw3_maps/native_brush_adapter_tests.py
          python3 tools/mw3_scripts/test_analyze.py
          python3 tools/mw3_weapons/test_conversion.py
          python3 -B -m unittest discover -s tools/mw3_world -p "test_*.py" -v
          python3 tools/test_bundle_mw3_assets.py
          python3 ports/ios/survival/tests/manual_retry_tests.py
          python3 ports/ios/survival/tests/save_isolation_tests.py
          python3 ports/ios/engine/tests/ServerBrowserTests.py
          python3 ports/ios/engine/tests/ClientIdentityTests.py
          python3 ports/ios/engine/tests/CoD4xDownloadTests.py
